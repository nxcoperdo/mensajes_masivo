<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>Planes y precios · Daemon Leads</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/auth.css" />
  <style>
    body { padding: 64px 24px; }

    .planes-header { text-align: center; max-width: 640px; margin: 0 auto 56px; }
    .planes-logo {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px;
    }
    .planes-logo svg { color: var(--color-brand-green); }
    .planes-logo span {
      font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--color-text);
    }
    .planes-logo em { color: var(--color-brand-green); font-style: normal; }
    .planes-logo small { font-size: 11px; color: var(--color-faint); margin-left: 2px; }

    .planes-eyebrow {
      font-size: 12px; font-weight: 600; color: var(--color-brand-green);
      letter-spacing: 0.15em; text-transform: uppercase; margin: 0 0 14px;
    }
    .planes-header h1 {
      font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3rem); font-weight: 800;
      color: var(--color-text); margin: 0 0 16px; line-height: 1.1;
    }
    .planes-header h1 em { color: var(--color-brand-green); font-style: normal; }
    .planes-header p { font-size: 15px; color: var(--color-muted); line-height: 1.65; margin: 0; }

    .planes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .plan-card {
      position: relative;
      background: var(--color-card);
      border: 1px solid var(--color-card-border);
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .plan-card:hover { transform: translateY(-3px); }
    .plan-card.destacado {
      background: linear-gradient(160deg, #0a1a0e 0%, #111d14 100%);
      border-color: rgba(61, 255, 160, 0.35);
      box-shadow: 0 0 40px rgba(61, 255, 160, 0.06);
    }

    .plan-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--color-brand-green) 0%, var(--color-brand-green-dim) 100%);
      color: #0a1a0e; font-size: 10px; font-weight: 800;
      padding: 4px 14px; border-radius: 20px;
      letter-spacing: 0.1em; text-transform: uppercase;
      font-family: var(--font-display); white-space: nowrap;
    }

    .plan-nombre { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--color-text); margin: 0 0 6px; }
    .plan-card.destacado .plan-nombre { color: var(--color-brand-green); }
    .plan-sub { font-size: 12px; color: var(--color-faint); margin: 0; }

    .plan-precio { font-family: var(--font-display); font-size: 32px; font-weight: 800; color: var(--color-text); line-height: 1; }
    .plan-precio-nota { font-size: 11px; color: var(--color-faint); margin: 5px 0 0; }

    .plan-divider { height: 1px; background: var(--color-card-border); }
    .plan-card.destacado .plan-divider { background: rgba(61, 255, 160, 0.15); }

    .plan-features { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .plan-feature { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-text-dim); }
    .plan-feature svg { color: var(--color-brand-green); flex-shrink: 0; }
    .plan-feature strong { color: var(--color-text); }

    .plan-cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; text-decoration: none; font-family: var(--font-display);
      border: 1px solid var(--color-card-border); color: var(--color-text-dim);
      background: transparent; transition: border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .plan-cta:hover { border-color: rgba(61, 255, 160, 0.4); color: var(--color-brand-green); }
    .plan-card.destacado .plan-cta {
      border: none; color: #0a1a0e;
      background: linear-gradient(135deg, var(--color-brand-green) 0%, var(--color-brand-green-dim) 100%);
    }
    .plan-card.destacado .plan-cta:hover { opacity: 0.9; color: #0a1a0e; }

    .planes-footer { text-align: center; margin-top: 48px; font-size: 12px; color: var(--color-faint); line-height: 1.7; }
    .planes-footer a { color: var(--color-brand-green); text-decoration: none; font-weight: 600; }
    .planes-footer a:hover { text-decoration: underline; }

    .planes-volver { text-align: center; margin-top: 32px; }
    .planes-volver a { color: var(--color-muted); text-decoration: none; font-size: 13px; }
    .planes-volver a:hover { color: var(--color-text-dim); }
  </style>
</head>
<body>
  <div class="planes-header">
    <div class="planes-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>
      <span>Daemon <em>Leads</em></span>
      <small>by CodeRepair Tech Inc.</small>
    </div>

    <p class="planes-eyebrow">Planes y precios</p>
    <h1>Elegí el plan que se ajusta<br /><em>a tu volumen</em></h1>
    <p>Precios en pesos colombianos, sin IVA. El IVA del 19% se suma al momento de facturar.</p>
  </div>

  <div class="planes-grid" id="planesGrid">
    <p class="muted" style="grid-column: 1 / -1; text-align: center;">Cargando planes…</p>
  </div>

  <p class="planes-footer" id="planesFooter"></p>

  <div class="planes-volver">
    <a href="/registro.html">← Volver al registro</a>
  </div>

  <script>
    const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const WHATSAPP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

    // El plan destacado ("más popular") es el tercero del catálogo — hoy
    // "Empresa", el primer nivel con soporte prioritario. Si el admin
    // reordena los planes, sigue el mismo criterio (índice, no nombre).
    const INDICE_DESTACADO = 2;
    const INDICE_DESDE_SOPORTE_PRIORITARIO = 2;

    function formatoPeso(n) {
      return '$' + Math.round(n).toLocaleString('es-CO');
    }

    async function cargarPlanes() {
      const res = await fetch('/api/planes-publico');
      const data = await res.json();
      const grid = document.getElementById('planesGrid');
      const footer = document.getElementById('planesFooter');

      const mensaje = (nombre) => encodeURIComponent(`Hola! Quiero contratar el plan ${nombre} de Daemon Leads.`);
      const linkContacto = (nombre) => data.contactoWhatsapp
        ? `https://wa.me/${data.contactoWhatsapp}?text=${mensaje(nombre)}`
        : null;

      grid.innerHTML = data.planes.map((plan, i) => {
        const destacado = i === INDICE_DESTACADO;
        const soportePrioritario = i >= INDICE_DESDE_SOPORTE_PRIORITARIO;
        const href = linkContacto(plan.nombre);
        return `
          <div class="plan-card ${destacado ? 'destacado' : ''}">
            ${destacado ? '<div class="plan-badge">Más popular</div>' : ''}
            <div>
              <h3 class="plan-nombre">${plan.nombre}</h3>
              <p class="plan-sub">Plan mensual · sin permanencia</p>
            </div>
            <div>
              <div class="plan-precio">${formatoPeso(plan.precio_sin_iva)}</div>
              <p class="plan-precio-nota">/mes · sin IVA</p>
            </div>
            <div class="plan-divider"></div>
            <div class="plan-features">
              <div class="plan-feature">${CHECK_ICON}<span><strong>${plan.mensajes_mes.toLocaleString('es-CO')}</strong> mensajes/mes</span></div>
              <div class="plan-feature">${CHECK_ICON}<span>Campañas masivas WhatsApp</span></div>
              <div class="plan-feature">${CHECK_ICON}<span>Plantillas personalizadas</span></div>
              <div class="plan-feature">${CHECK_ICON}<span>Importación CSV / Excel</span></div>
              ${soportePrioritario ? `<div class="plan-feature">${CHECK_ICON}<span>Soporte prioritario</span></div>` : ''}
            </div>
            ${href
              ? `<a class="plan-cta" href="${href}" target="_blank" rel="noopener">${WHATSAPP_ICON} Contactar para compra</a>`
              : `<span class="plan-cta" style="opacity: 0.5; cursor: default;">${WHATSAPP_ICON} Contactanos por otro medio</span>`}
          </div>
        `;
      }).join('');

      const linkGenerico = linkContacto('a medida');
      footer.innerHTML = `Todos los precios en pesos colombianos (COP) · IVA ${Math.round(data.ivaPorcentaje * 100)}% no incluido · Sin permanencia mínima<br />` +
        (linkGenerico
          ? `¿Necesitás un volumen diferente? <a href="${linkGenerico}" target="_blank" rel="noopener">Escribinos y armamos un plan a medida</a>`
          : `¿Necesitás un volumen diferente? Escribinos por otro medio y armamos un plan a medida.`);
    }

    cargarPlanes();
  </script>
</body>
</html>
